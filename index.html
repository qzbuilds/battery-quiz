<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>你的打工人电量还剩几格</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background: #f6f3ee;
      color: #2b2b2b;
    }
    .page { display: none; min-height: 100%; padding: 32px 22px calc(32px + env(safe-area-inset-bottom)); }
    .page.on { display: block; }
    h1 { font-size: 26px; line-height: 1.35; margin-bottom: 14px; }
    .sub { font-size: 15px; line-height: 1.7; color: #6b6b6b; margin-bottom: 28px; }
    .battery { width: 120px; height: 56px; border: 4px solid #2b2b2b; border-radius: 10px; position: relative; margin: 8px 0 28px; padding: 5px; display: flex; }
    .battery::after { content: ""; position: absolute; right: -12px; top: 15px; width: 8px; height: 18px; background: #2b2b2b; border-radius: 0 4px 4px 0; }
    .cell { flex: 1; margin-right: 4px; border-radius: 4px; background: #e2ddd5; }
    .cell:last-child { margin-right: 0; }
    .cell.full { background: #3fb27f; }
    .cell.mid { background: #f2b33d; }
    .cell.low { background: #e5574b; }
    .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 600; background: #2b2b2b; color: #fff; }
    .progress { font-size: 13px; color: #9a948b; margin-bottom: 12px; }
    .q { font-size: 20px; line-height: 1.5; font-weight: 600; margin-bottom: 22px; }
    .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2ddd5; background: #fff; border-radius: 14px; padding: 15px 16px; font-size: 16px; line-height: 1.5; margin-bottom: 12px; color: #2b2b2b; }
    .opt:active { border-color: #2b2b2b; }
    .card { background: #fff; border-radius: 18px; padding: 24px 20px; margin-bottom: 18px; }
    .tag { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #2b2b2b; color: #fff; margin-bottom: 12px; }
    .rname { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .rdesc { font-size: 15px; line-height: 1.8; color: #444; }
    .tip { font-size: 15px; line-height: 1.8; color: #444; margin-top: 12px; }
    .note { font-size: 12px; line-height: 1.7; color: #9a948b; margin-top: 18px; }
    .ghost { background: transparent; color: #2b2b2b; border: 2px solid #2b2b2b; margin-top: 12px; }
  </style>
</head>
<body>
  <section class="page on" id="p-start">
    <h1>你的打工人电量<br />还剩几格？</h1>
    <p class="sub">8 道题，凭第一反应选。<br />测完看看你是满电冲锋，还是该关机充电了。</p>
    <div class="battery" id="start-battery"></div>
    <button class="btn" id="btn-start">开始测</button>
    <p class="note">纯娱乐，不是心理测评或医学建议。不收集任何个人信息，答案只在你的手机上计算。</p>
  </section>

  <section class="page" id="p-quiz">
    <p class="progress" id="progress"></p>
    <p class="q" id="question"></p>
    <div id="options"></div>
  </section>

  <section class="page" id="p-result">
    <div class="card">
      <span class="tag" id="r-level"></span>
      <div class="battery" id="r-battery"></div>
      <p class="rname" id="r-name"></p>
      <p class="rdesc" id="r-desc"></p>
      <p class="tip" id="r-tip"></p>
    </div>
    <button class="btn" id="btn-again">再测一次</button>
    <p class="note">纯娱乐，不是心理测评或医学建议。</p>
  </section>

  <script src="./main.js"></script>
</body>
</html>
